name: Docker Build Check

on:
  push:
    branches: [ "main", "v3" ]
  pull_request:
    branches: [ "main", "v3" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag neurolab-ai:$(date +%s)
